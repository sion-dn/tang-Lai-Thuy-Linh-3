<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc cậu đỗ NV1 💌</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
overflow:hidden;height:100vh;
background:linear-gradient(to bottom,#07111f,#142850,#2b3a67);
font-family:Arial,sans-serif;color:white;
cursor:none;
}
#starCursor{
position:fixed;
left:0;top:0;
font-size:24px;
pointer-events:none;
z-index:9999;
}

.star,.firefly,.petal,.heart{position:absolute;pointer-events:none}
.star{width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 2s infinite}
@keyframes twinkle{50%{opacity:.2}}

.firefly{
width:6px;height:6px;
background:#ffd84d;
border-radius:50%;
box-shadow:0 0 15px #ffd84d;
animation:float 8s linear infinite;
}
@keyframes float{
to{transform:translateY(-120vh) translateX(100px)}
}

.center{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
text-align:center;
}

.envelope{
font-size:120px;
cursor:pointer;
animation:bob 2s infinite;
}

@keyframes bob{
50%{transform:translateY(-10px)}
}

.card{
display:none;
width:min(90vw,650px);
background:rgba(255,255,255,.12);
backdrop-filter:blur(10px);
padding:30px;
border-radius:25px;
box-shadow:0 0 25px rgba(255,255,255,.25);
animation:show .8s ease;
}

@keyframes show{
from{opacity:0;transform:scale(.6)}
to{opacity:1;transform:scale(1)}
}

h1{margin-bottom:15px}
#typing{line-height:1.8}

.glow{
font-size:36px;
font-weight:bold;
color:#ffe066;
text-shadow:0 0 10px #ffe066,0 0 30px #ffe066;
margin-top:20px;
}

@keyframes fall{
to{transform:translateY(110vh) rotate(360deg)}
}
</style>
</head>
<body>

<div id="starCursor">⭐</div>

<div class="center" id="envelopeBox">
<div class="envelope" onclick="openCard()">💌</div>
<p>Nhấn để mở thiệp</p>
</div>

<div class="center">
<div class="card" id="card">
<h1>🌙 Gửi cậu</h1>
<p id="typing"></p>
<div id="final"></div>
</div>
</div>

<audio id="music" loop>
<source src="precious.mp3" type="audio/mpeg">
</audio>

<script>
const cursor=document.getElementById("starCursor");
document.addEventListener("mousemove",(e)=>{
 cursor.style.left=e.clientX+"px";
 cursor.style.top=e.clientY+"px";
});

for(let i=0;i<120;i++){
 let s=document.createElement("div");
 s.className="star";
 s.style.left=Math.random()*100+"vw";
 s.style.top=Math.random()*100+"vh";
 s.style.animationDelay=Math.random()*2+"s";
 document.body.appendChild(s);
}

for(let i=0;i<20;i++){
 let f=document.createElement("div");
 f.className="firefly";
 f.style.left=Math.random()*100+"vw";
 f.style.top=Math.random()*100+"vh";
 f.style.animationDuration=(5+Math.random()*8)+"s";
 document.body.appendChild(f);
}

const text="Chúc cậu thật bình tĩnh, tự tin và làm bài thật tốt trong kỳ thi THPTQG sắp tới. Mong mọi nỗ lực của cậu sẽ được đền đáp bằng kết quả xứng đáng. Dù thế nào đi nữa, hãy tin vào bản thân mình nhé 🍀✨";

function openCard(){
 document.getElementById("envelopeBox").style.display="none";
 document.getElementById("card").style.display="block";
 document.getElementById("music").play().catch(()=>{});
 typeWriter();
}

let i=0;
function typeWriter(){
 if(i<text.length){
   document.getElementById("typing").innerHTML+=text.charAt(i);
   i++;
   setTimeout(typeWriter,40);
 }else{
   showFinal();
 }
}

function showFinal(){
 document.getElementById("final").innerHTML='<div class="glow">🎓 Chúc cậu đỗ NV1 nha! 🎆</div>';
 fireworks();
}

function createPetal(){
 let p=document.createElement("div");
 p.className="petal";
 p.innerHTML="🌸";
 p.style.left=Math.random()*100+"vw";
 p.style.top="-30px";
 p.style.fontSize=(15+Math.random()*15)+"px";
 p.style.animation=`fall ${6+Math.random()*5}s linear forwards`;
 document.body.appendChild(p);
 setTimeout(()=>p.remove(),12000);
}
setInterval(createPetal,400);

function createHeart(){
 let h=document.createElement("div");
 h.className="heart";
 h.innerHTML=Math.random()>0.5?"❤️":"💖";
 h.style.left=Math.random()*100+"vw";
 h.style.top="-30px";
 h.style.animation=`fall ${4+Math.random()*4}s linear forwards`;
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),9000);
}
setInterval(createHeart,250);

function fireworks(){
 for(let k=0;k<120;k++){
   let f=document.createElement("div");
   f.innerHTML="✨";
   f.style.position="absolute";
   f.style.left="50vw";
   f.style.top="45vh";
   let a=Math.random()*Math.PI*2;
   let d=100+Math.random()*300;
   f.animate(
    [{transform:"translate(0,0)",opacity:1},
     {transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`,opacity:0}],
    {duration:2000}
   );
   document.body.appendChild(f);
   setTimeout(()=>f.remove(),2000);
 }
}
</script>
</body>
</html>
